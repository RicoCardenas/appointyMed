server:
  port: ${PORT:8083}

spring:
  application:
    name: appointment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointy}
    username: ${APPOINTMENT_DB_USER:appointment_svc}
    password: ${APPOINTMENT_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: appointment
      hibernate.jdbc.time_zone: UTC
  flyway:
    schemas: appointment
    default-schema: appointment
    create-schemas: false

app:
  # Zona horaria de la clinica: las franjas guardan fecha y hora locales y "hoy" sale de aqui. Los instantes se guardan en UTC.
  timezone: ${APP_TIMEZONE:America/Bogota}
  jwt:
    secret: ${JWT_SECRET}            # el mismo valor que usa auth-service
    issuer: appointy-auth
  internal:
    api-key: ${INTERNAL_API_KEY}     # protege /internal/**; mismo valor en todos los servicios
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:5000}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
    connect-timeout-ms: ${NOTIFICATION_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${NOTIFICATION_READ_TIMEOUT_MS:5000}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
