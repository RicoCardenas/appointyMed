server:
  port: ${PORT:8083}

spring:
  application:
    name: appointment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointy}
    username: ${APPOINTMENT_DB_USER:appointment_svc}
    password: ${APPOINTMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: appointment
  flyway:
    schemas: appointment
    default-schema: appointment
    create-schemas: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
