spring:
  application:
    name: appointment-service-test

  datasource:
    url: jdbc:h2:mem:appointment_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

app:
  jwt:
    access-token-secret: your-super-secret-access-token-key-min-32-chars-long

  aws:
    region: us-east-1
    sqs:
      notification-queue-url: http://localhost:4566/000000000000/notification-queue
    credentials:
      access-key: test
      secret-key: test

server:
  port: 0
