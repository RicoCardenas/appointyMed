server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appointy}}
    username: ${AUTH_DB_USER:auth_svc}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO auth   # sin esto, el SQL nativo falla con un solo usuario de BD (Render)
  jackson:
    deserialization:
      # Un campo desconocido (p. ej. la cedula en la actualizacion del paciente) se rechaza con 400.
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: auth
      hibernate.jdbc.time_zone: UTC
  flyway:
    schemas: auth
    default-schema: auth
    create-schemas: ${FLYWAY_CREATE_SCHEMAS:false}

app:
  jwt:
    secret: ${JWT_SECRET}            # minimo 32 caracteres; el mismo valor en todos los servicios
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    issuer: appointy-auth
  internal:
    api-key: ${INTERNAL_API_KEY}     # protege /internal/**; mismo valor en todos los servicios
  admin:                             # administrador inicial, solo si aun no existe ninguno
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
  paths-to-match: /api/**

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
