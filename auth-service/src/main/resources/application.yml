server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointy}
    username: ${AUTH_DB_USER:auth_svc}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: auth
  flyway:
    schemas: auth
    default-schema: auth
    create-schemas: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
