spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql
      encoding: UTF-8

  flyway:
    enabled: false

  h2:
    console:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:

app:
  jwt:
    access-token-secret: test-access-token-secret-key-for-testing-only-32-chars
    refresh-token-secret: test-refresh-token-secret-key-for-testing-only-32-chars
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000

  aws:
    region: us-east-1
    sqs:
      notification-queue-url: https://sqs.us-east-1.amazonaws.com/123456789/test-queue

logging:
  level:
    com.appointymed.auth: DEBUG
    org.springframework.security: DEBUG