spring:
  datasource:
    url: jdbc:tc:postgresql:16:///testdb
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:

app:
  jwt:
    access-token-secret: test-access-token-secret-key-for-testing-only-32-chars
    refresh-token-secret: test-refresh-token-secret-key-for-testing-only-32-chars
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000

  aws:
    region: us-east-1
    sqs:
      notification-queue-url: https://sqs.us-east-1.amazonaws.com/123456789/test-queue

logging:
  level:
    com.appointymed.auth: DEBUG
    org.springframework.security: DEBUG