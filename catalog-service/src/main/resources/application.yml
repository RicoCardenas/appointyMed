server:
  port: ${PORT:8082}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appointy}}
    username: ${CATALOG_DB_USER:catalog_svc}
    password: ${CATALOG_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: catalog
      hibernate.jdbc.time_zone: UTC
  flyway:
    schemas: catalog
    default-schema: catalog
    create-schemas: ${FLYWAY_CREATE_SCHEMAS:false}

app:
  # Zona horaria de la clinica: define "hoy" al generar franjas. Los instantes se guardan en UTC.
  timezone: ${APP_TIMEZONE:America/Bogota}
  jwt:
    secret: ${JWT_SECRET}            # el mismo valor que usa auth-service
    issuer: appointy-auth
  internal:
    api-key: ${INTERNAL_API_KEY}     # protege /internal/**; mismo valor en todos los servicios
  appointment:
    base-url: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: ${APPOINTMENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${APPOINTMENT_READ_TIMEOUT_MS:5000}

  festivos:                          # API externa de dias festivos (Nager.Date, sin llave); opcional: si falla se generan todas las franjas
    base-url: ${FESTIVOS_API_URL:https://date.nager.at}
    pais: ${FESTIVOS_PAIS:CO}
    connect-timeout-ms: ${FESTIVOS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${FESTIVOS_READ_TIMEOUT_MS:3000}
    ttl-horas: ${FESTIVOS_TTL_HORAS:24}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
  paths-to-match: /api/**

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
