server:
  port: ${PORT:8085}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointy}
    username: ${NOTIFICATION_DB_USER:notification_svc}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notification
      hibernate.jdbc.time_zone: UTC
  flyway:
    schemas: notification
    default-schema: notification
    create-schemas: false

app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  jwt:
    secret: ${JWT_SECRET}            # el mismo valor que usa auth-service
    issuer: appointy-auth
  internal:
    api-key: ${INTERNAL_API_KEY}     # protege /internal/**; mismo valor en todos los servicios
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: ${AUTH_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AUTH_READ_TIMEOUT_MS:5000}
  mail:
    enabled: ${MAIL_ENABLED:false}   # false: no envia, solo registra la notificacion como enviada (simulado)
    provider: ${MAIL_PROVIDER:smtp}  # smtp | brevo (API HTTP por 443, para donde el SMTP esta bloqueado)
    from: ${MAIL_FROM:no-responder@appointy.local}  # con brevo, debe ser un remitente verificado
    brevo:
      base-url: ${BREVO_BASE_URL:https://api.brevo.com}
      api-key: ${BREVO_API_KEY:}
      connect-timeout-ms: ${BREVO_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${BREVO_READ_TIMEOUT_MS:8000}
  notification:
    max-intentos: ${NOTIFICATION_MAX_INTENTOS:3}
    lote: ${NOTIFICATION_LOTE:100}
  jobs:
    recordatorios-ms: ${JOB_RECORDATORIOS_MS:60000}
    reintentos-ms: ${JOB_REINTENTOS_MS:300000}

# Solo se usa con app.mail.enabled=true y provider=smtp
spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties.mail.smtp:
    auth: true
    starttls.enable: true
    connectiontimeout: 5000
    timeout: 5000
    writetimeout: 5000

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
  paths-to-match: /api/**

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  health:
    mail:
      enabled: false   # una caida del SMTP no debe marcar el servicio como DOWN (RNF-07)
  endpoints:
    web:
      exposure:
        include: health,info
