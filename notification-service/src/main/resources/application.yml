server:
  port: ${PORT:8085}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointy}
    username: ${NOTIFICATION_DB_USER:notification_svc}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notification
  flyway:
    schemas: notification
    default-schema: notification
    create-schemas: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
